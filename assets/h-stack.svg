<svg xmlns="http://www.w3.org/2000/svg" width="900" height="46" viewBox="0 0 900 46" role="img" aria-label="TOOLBOX">
<title>TOOLBOX</title>
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="glow-s" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="1" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1.4" fill="#000" opacity=".28"/>
  </pattern>
</defs>
<rect width="900" height="46" fill="#030703"/>
<text x="10" y="30" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#2a8f12" font-weight="bold" text-anchor="start" xml:space="preserve">//</text>
<text x="44" y="30" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="22" fill="#39ff14" font-weight="bold" text-anchor="start" xml:space="preserve" filter="url(#glow-s)" letter-spacing="2">TOOLBOX</text>
<line x1="167" y1="24" x2="890" y2="24" stroke="#2a8f12" stroke-dasharray="3 4"/>
<rect width="900" height="46" fill="url(#scan)" pointer-events="none"/>
</svg>
