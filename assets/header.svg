<svg xmlns="http://www.w3.org/2000/svg" width="830" height="120" viewBox="0 0 830 120" role="img" aria-label="Sai Maheswar: full-stack and AI engineer">
<title>Sai Maheswar</title>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#0284c7"/></linearGradient></defs>
<style>
  .name{font:800 46px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;letter-spacing:-1.5px;fill:url(#g);animation:rise .7s ease-out backwards}
  .sub{font:500 20px -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;fill:#758195;opacity:0}
  .bar{fill:#10b981;animation:grow .8s .2s ease-out backwards}
  .s1{opacity:1;animation:s1 12s linear infinite}
  .s2{animation:s2 12s linear infinite}
  .s3{animation:s3 12s linear infinite}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}}
  @keyframes grow{from{width:0}}
  @keyframes s1{0%,28%{opacity:1}33%,95%{opacity:0}100%{opacity:1}}
  @keyframes s2{0%,28%{opacity:0}33%,61%{opacity:1}66%,100%{opacity:0}}
  @keyframes s3{0%,61%{opacity:0}66%,94%{opacity:1}100%{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.s1{opacity:1}}
</style>
<text class="name" x="2" y="54">Sai Maheswar</text>
<rect class="bar" x="4" y="70" width="56" height="4" rx="2"/>
<text class="sub s1" x="2" y="106">Full-stack &amp; AI engineer</text>
<text class="sub s2" x="2" y="106">Data pipelines that prove they're correct</text>
<text class="sub s3" x="2" y="106">Python · TypeScript · Spark · DuckDB</text>
</svg>
