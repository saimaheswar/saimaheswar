<svg xmlns="http://www.w3.org/2000/svg" width="900" height="96" viewBox="0 0 900 96" role="img" aria-label="12 public repos, 706 tests across 4 data projects, Python and TypeScript">
<title>12 public repos, 706 tests across 4 data projects, Python and TypeScript</title>
<defs>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="2.2" result="b"/>
